{% extends "base.html" %}

{% block title %}Login{% endblock %}
{% block page_title %}Login{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-school"></i>
                </div>
                <h1>Colégio Mauá</h1>
                <p>Sistema de Chamados</p>
            </div>

            <form method="POST" action="{{ url_for('main.login') }}" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="seu@email.com" required autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="senha" name="senha" placeholder="Sua senha" required>
                        <button type="button" class="toggle-password" tabindex="-1">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-sign-in-alt"></i> Entrar
                </button>
            </form>

{# Evita tela de login antiga restaurada do histórico após autenticar. #}
{% block extra_js %}
{{ super() }}
<script>
(function () {
    'use strict';
    const formulario = document.querySelector('form.auth-form');
    const botao = formulario && formulario.querySelector('button[type="submit"]');
    const textoOriginal = botao ? botao.innerHTML : '';

    function restaurarBotao() {
        if (!botao) return;
        botao.disabled = false;
        botao.innerHTML = textoOriginal;
        delete botao.dataset.originalText;
    }

    // Ao voltar pelo histórico, o navegador pode exibir um snapshot antigo.
    // Uma consulta real ao /login deixará o Flask decidir: se estiver
    // autenticado, redireciona; caso contrário, apresenta o login normal.
    window.addEventListener('pageshow', function (evento) {
        restaurarBotao();
        const navegacao = performance.getEntriesByType('navigation')[0];
        const retornoHistorico = navegacao && navegacao.type === 'back_forward';
        if (evento.persisted || retornoHistorico) {
            window.location.replace('{{ url_for("main.login") }}?verificar_sessao=' + Date.now());
        }
    });

    // Evita armazenar "Processando..." no histórico visual do navegador.
    window.addEventListener('pagehide', restaurarBotao);
})();
</script>
{% endblock %}
